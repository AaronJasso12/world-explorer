@if (countryResource.error() || !countryResource.value()) {
  <app-not-found/>
}

@if (countryResource.isLoading()) {
  <h1 class="text-3xl">Cargando...</h1>
}

@if (countryResource.hasValue()) {
  <country-information-page
    [country]="countryResource.value()!"
    [imgsUrl]="unsplashResource.value() ?? []"
  />
}
